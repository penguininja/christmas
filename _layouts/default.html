<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
</head>

<body>
  <div class="content">
    {{ content }}
  </div>
</body>

<script>
function darkMode() {
   var element = document.body;
   element.classList.toggle("dark-mode");
}

function showTab(tabName) {
  // Hide all tab contents
  var tabContents = document.querySelectorAll('.tab-content');
  tabContents.forEach(function(content) {
    content.style.display = 'none';
  });

  // Remove active class from all buttons
  var tabButtons = document.querySelectorAll('.tab-button');
  tabButtons.forEach(function(button) {
    button.classList.remove('active');
  });

  // Show the selected tab content
  if (tabName === 'alphabetical') {
    document.getElementById('alphabetical-nav').style.display = 'block';
  } else if (tabName === 'category') {
    document.getElementById('category-nav').style.display = 'block';
  }

  // Add active class to clicked button
  event.target.classList.add('active');
}
</script>
</html>
